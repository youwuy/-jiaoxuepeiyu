name: CI

on:
  push:
    branches:
      - main
      - zhan/frontend-test
      - chen/backend
  pull_request:
    branches:
      - main
      - zhan/frontend-test
      - chen/backend

jobs:
  backend:
    name: Backend Java 8
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/pom.xml') != '' }}

    services:
      mysql:
        image: mysql:5.7.42
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: jiaoxuepeiyu
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Static backend verification
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/verify-backend-static.ps1

      - name: Static deployment layout verification
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/verify-deploy-layout.ps1

      - name: Install MySQL client
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Verify MySQL 5.7 schema import
        working-directory: ${{ github.workspace }}
        env:
          MYSQL_PWD: root123456
        run: |
          for file in database/init/*.sql; do
            mysql -h 127.0.0.1 -P 3306 -uroot jiaoxuepeiyu < "$file"
          done

      - name: Run backend tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: jiaoxuepeiyu
          MYSQL_USER: root
          MYSQL_PASSWORD: root123456
        run: mvn -B clean test

      - name: Package backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: jiaoxuepeiyu
          MYSQL_USER: root
          MYSQL_PASSWORD: root123456
        run: mvn -B package -DskipTests

  frontend:
    name: Frontend Node 18
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  root-frontend:
    name: Root Frontend Node 18
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build root frontend
        run: pnpm build
